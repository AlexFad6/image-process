name: Build & Release

on:
  push:
    tags:
      - "v*"          # 打 v 开头的 tag 时自动构建并发布 Release
  workflow_dispatch:  # 允许在 Actions 页面手动运行（只构建不上传 Release）

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: image-process-windows
            build_name: image-process-win
            binary: image-process-win.exe
          - os: macos-latest
            artifact_name: image-process-macos
            build_name: image-process-mac
            binary: image-process-mac
          - os: ubuntu-latest
            artifact_name: image-process-linux
            build_name: image-process-linux
            binary: image-process-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build translations
        run: python update_translations.py

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm --noconsole --onefile --icon app_icon.ico --name "${{ matrix.build_name }}" --add-data "app_icon.png${{ matrix.os == 'windows-latest' && ';' || ':' }}." --add-data "translations${{ matrix.os == 'windows-latest' && ';' || ':' }}translations" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary }}

  release:
    needs: build          # 等三个平台的构建全部完成
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许创建 Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/image-process-windows/image-process-win.exe
            dist/image-process-macos/image-process-mac
            dist/image-process-linux/image-process-linux